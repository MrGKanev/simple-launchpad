name: Release

on:
  push:
    tags:
      - "*"

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches app version
        run: |
          v=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Sources/SimpleLaunchpad/Resources/Info.plist)
          [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "Tag $GITHUB_REF_NAME != Info.plist $v"; exit 1; }
      - name: Test
        run: swift test
      - name: Build app bundle
        run: sh Scripts/build-app-bundle.sh
      - name: Zip app bundle
        run: |
          cd .build/release
          zip -r -y "Simple Launchpad.app.zip" "Simple Launchpad.app"
      - name: Build DMG
        run: sh Scripts/build-dmg.sh
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            .build/release/Simple Launchpad.app.zip
            .build/release/Simple Launchpad.dmg
          generate_release_notes: true
